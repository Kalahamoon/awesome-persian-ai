<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="mesh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="600" cy="200" r="350" fill="url(#mesh)"/>

  <!-- Neural Mesh Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="100" y1="50" x2="300" y2="180"/>
    <line x1="300" y1="180" x2="500" y2="90"/>
    <line x1="500" y1="90" x2="700" y2="210"/>
    <line x1="700" y1="210" x2="900" y2="120"/>
    <line x1="900" y1="120" x2="1100" y2="280"/>
    <line x1="200" y1="320" x2="300" y2="180"/>
    <line x1="500" y1="90" x2="600" y2="340"/>
    <line x1="600" y1="340" x2="850" y2="320"/>
    <line x1="850" y1="320" x2="1000" y2="150"/>
  </g>

  <!-- Connection Nodes -->
  <g fill="#0ea5e9" filter="url(#glow)">
    <circle cx="300" cy="180" r="6"/>
    <circle cx="500" cy="90" r="8" fill="#a855f7"/>
    <circle cx="700" cy="210" r="7" fill="#10b981"/>
    <circle cx="850" cy="320" r="6" fill="#f59e0b"/>
    <circle cx="900" cy="120" r="5" fill="#38bdf8"/>
    <circle cx="600" cy="340" r="7" fill="#ec4899"/>
  </g>

  <!-- Central Emblem / Iran AI Core -->
  <g transform="translate(600, 150)">
    <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="url(#cyan-glow)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#64748b" stroke-dasharray="4,4"/>
    <!-- Futuristic MCP Cube / Node Icon -->
    <path d="M-18 -10 L0 -22 L18 -10 L18 14 L0 26 L-18 14 Z" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="0" y1="-22" x2="0" y2="26" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-18" y1="-10" x2="0" y2="2" stroke="#38bdf8" stroke-width="2"/>
    <line x1="18" y1="-10" x2="0" y2="2" stroke="#38bdf8" stroke-width="2"/>
    <!-- Core Pulse -->
    <circle cx="0" cy="2" r="4" fill="#a855f7"/>
  </g>

  <!-- Title & Typography -->
  <!-- English Subtitle/Header -->
  <text x="600" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#f8fafc">
    AWESOME PERSIAN AI &amp; MCP HUB
  </text>
  
  <text x="600" y="295" text-anchor="middle" font-family="'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif" font-weight="600" font-size="20" fill="#38bdf8">
    مرکز جامع ابزارها، پروتکل MCP، مدل‌ها، و خدمات هوش مصنوعی زیست‌بوم فارسی
  </text>

  <!-- Badges Mockup inside Banner -->
  <g transform="translate(600, 340)">
    <!-- Badge 1: MCP Protocol -->
    <g transform="translate(-250, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#bae6fd">⚡ MCP PROTOCOL</text>
    </g>
    <!-- Badge 2: LLMs & Tools -->
    <g transform="translate(-80, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#e9d5ff">🧠 PERSIAN LLMS</text>
    </g>
    <!-- Badge 3: Cloud & Gateways -->
    <g transform="translate(90, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">☁️ CLOUD &amp; APIS</text>
    </g>
    <!-- Badge 4: Production Agents -->
    <g transform="translate(260, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#fde68a">🤖 AGENT TOOLS</text>
    </g>
  </g>
</svg>
